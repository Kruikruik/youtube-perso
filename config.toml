# Config perso : YouTube sans pubs + confort de visionnage
# Doc des options : CONFIG.md
#
# Mode automatique : dernières versions STABLES des patchs, et pour chaque appli
# la version la plus récente supportée par ces patchs (jamais les expérimentales).
# Le workflow CI vérifie chaque jour et recompile seulement s'il y a du nouveau.
# Pour figer une version : remplace "latest" / "auto" par un numéro.

enable-module-update = false
parallel-jobs = 1
patches-version = "latest"
cli-version = "latest"

[YouTube-Morphe]
app-name = "YouTube"
build-mode = "apk"            # APK non-root (connexion Google via MicroG / GmsCore)
version = "auto"              # plus récente version stable supportée par les patchs
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/youtube"
archive-dlurl = "https://archive.org/download/jhc-apks/apks/com.google.android.youtube"
enable-update-checks = false

# Patchs par défaut gardés : Hide ads, arrière-plan, SponsorBlock,
# Return YouTube Dislike, qualité/vitesse par défaut, Swipe controls,
# masquer Shorts / cartes de fin, etc. (réglables dans l'appli).
# On retire juste quelques gadgets inutiles.
excluded-patches = """\
  'Enable debugging' \
  'Change form factor' \
  'Spoof device dimensions' \
  'Voice over translation' \
  """

# Twitch : patchs ReVanced (Morphe ne gère pas Twitch).
# Les patchs sont récupérés sur GitLab par .github/scripts/prefetch-gitlab-patches.sh
[Twitch]
app-name = "Twitch"
build-mode = "apk"
patches-source = "ReVanced/revanced-patches"
patches-version = "latest"
cli-source = "ReVanced/revanced-cli"
cli-version = "latest"
rv-brand = "ReVanced"
version = "auto"
apkmirror-dlurl = "https://www.apkmirror.com/apk/twitch-interactive-inc/twitch/"
enable-update-checks = false
