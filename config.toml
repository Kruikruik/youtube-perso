# Config perso : YouTube sans pubs + confort de visionnage
# Doc des options : CONFIG.md
#
# Tout est figé pour éviter les mauvaises surprises.
# Pour mettre à jour : change patches-version / cli-version / version,
# pousse le fichier, et la compilation se relance toute seule.

enable-module-update = false
parallel-jobs = 1
patches-version = "v2.2.0"
cli-version = "v2.1.1"

[YouTube-Morphe]
app-name = "YouTube"
build-mode = "apk"            # APK non-root (connexion Google via MicroG / GmsCore)
version = "21.30.216"         # plus récente version stable supportée par les patchs v2.2.0
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/youtube"
archive-dlurl = "https://archive.org/download/jhc-apks/apks/com.google.android.youtube"
enable-update-checks = false

# Patchs par défaut gardés : Hide ads, arrière-plan, SponsorBlock,
# Return YouTube Dislike, qualité/vitesse par défaut, Swipe controls,
# masquer Shorts / cartes de fin, etc. (réglables dans l'appli).
# On retire juste quelques gadgets inutiles.
excluded-patches = """\
  'Enable debugging' \
  'Change form factor' \
  'Spoof device dimensions' \
  'Voice over translation' \
  """
