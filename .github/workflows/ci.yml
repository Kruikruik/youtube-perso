name: CI
# Vérifie chaque jour si une nouvelle version STABLE des patchs est sortie
# (Morphe pour YouTube, ReVanced pour Twitch). Si oui : recompile tout.
on:
  workflow_dispatch:
  schedule:
    - cron: "37 4 * * *"

jobs:
  check:
    runs-on: ubuntu-latest
    permissions: write-all
    outputs:
      SHOULD_BUILD: ${{ steps.check.outputs.SHOULD_BUILD }}
    steps:
      - name: Nouvelles versions des patchs ?
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          morphe=$(gh api repos/MorpheApp/morphe-patches/releases/latest -q .tag_name)
          revanced=$(curl -fsSL https://api.revanced.app/v5/patches | jq -r .version)
          last=$(gh release view -R "$GITHUB_REPOSITORY" --json body -q .body 2>/dev/null || true)
          echo "Morphe: $morphe | ReVanced: $revanced"
          build=0
          grep -q "morphe-patches/patches-${morphe#v}\." <<<"$last" || { echo "-> nouveaux patchs Morphe"; build=1; }
          grep -q "revanced-patches/patches-${revanced#v}\." <<<"$last" || { echo "-> nouveaux patchs ReVanced"; build=1; }
          echo "SHOULD_BUILD=$build" >> "$GITHUB_OUTPUT"

      - name: Nettoyer les vieux runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run list -R "$GITHUB_REPOSITORY" -L400 --json databaseId -q '.[].databaseId' | tail -n+20 | xargs -IID gh api "repos/$GITHUB_REPOSITORY/actions/runs/ID" -X DELETE || :

  build:
    permissions: write-all
    needs: check
    if: ${{ needs.check.outputs.SHOULD_BUILD == '1' }}
    uses: ./.github/workflows/build.yml
    with:
      from_ci: false
    secrets: inherit
